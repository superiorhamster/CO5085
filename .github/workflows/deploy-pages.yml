name: Deploy CO5085 GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate notebooks integrity
        run: python3 tools/validate_notebooks.py

      - name: Validate GitHub Pages structure and links
        run: python3 tools/validate_site.py

      - name: Verify compiled report publication and numerical traceability
        run: python3 -m unittest tools.test_reports

      - name: Verify lightweight A1 and A2 bundles
        run: python3 tools/web_artifacts.py check --artifacts-dir artifacts

      - name: Validate web bundle imports and preservation
        run: python3 -m unittest tools.test_web_artifacts

      - name: Validate A1 dashboard states
        run: node tools/test_a1_dashboard.cjs

      - name: Validate A2 artifact publishing contract
        run: python3 -m unittest tools.test_a2_site_contract tools.test_a2_web_export

      - name: Validate A2 dashboard renderer
        run: node tools/test_a2_dashboard.cjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact (docs/)
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./docs"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-validate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

